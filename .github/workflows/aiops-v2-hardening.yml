name: aiops-v2 hardening

on:
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "web/**"
      - "docs/**"
      - "testdata/workflow_canvas_mcp/**"
      - "testdata/eval_cases/workflow_canvas/**"
      - "scripts/workflow-canvas-*"
      - "scripts/check-workflow-evidence-redaction.sh"
      - "scripts/aichat-harness-hardening-gate.sh"
      - "scripts/check-aiops-change-budget.sh"
      - "scripts/check-aiops-final-text-control.py"
      - "scripts/check-aiops-harness-contract-boundaries.sh"
      - "scripts/test-aiops-change-budget.sh"
      - "scripts/test-aiops-harness-contract-boundaries.sh"
      - ".github/workflows/aiops-v2-hardening.yml"
      - ".github/workflows/workflow-canvas-*.yml"
  push:
    branches:
      - main
      - content_fix_0524
  workflow_dispatch:

jobs:
  backend-agent-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install harness scan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          rg --version
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run harness boundary self-test
        run: |
          scripts/test-aiops-harness-contract-boundaries.sh
          scripts/test-aiops-change-budget.sh
      - name: Run agent harness hardening gate
        env:
          AIOPS_HARNESS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          AIOPS_HARNESS_HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          AIOPS_HARNESS_REQUIRE_BASELINE_ACK: "1"
          AIOPS_CHANGE_BASELINE_ACK: "2026-07-14-harness-change-policy-bootstrap"
          AIOPS_CHANGE_BASELINE_REASON: "Commits before the permanent change gate are the reviewed harness rollout baseline."
        run: scripts/aichat-harness-hardening-gate.sh

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run web unit tests
        working-directory: web
        run: npm test -- --run
      - name: Build web
        working-directory: web
        run: npm run build

  workflow-canvas-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Initialize allowlisted Workflow Canvas evidence
        env:
          AIOPS_WORKFLOW_EVIDENCE_DIR: ${{ runner.temp }}/workflow-canvas-evidence
        run: scripts/workflow-canvas-ci-evidence.sh pr chromium
      - name: Install Workflow Canvas test dependencies
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Validate Workflow Canvas manifest and active PR cases
        env:
          AIOPS_WORKFLOW_EVIDENCE_DIR: ${{ runner.temp }}/workflow-canvas-evidence
        run: scripts/workflow-canvas-test-gate.sh pr
      - name: Run active Workflow domain, MCP, transaction, and security tests
        run: |
          go test ./internal/integrations/workfloweditor ./internal/mcp/runtime ./internal/server -run 'TestWorkflow|MCP-|SEC-' -count=1
          (cd pkg/runner && go test ./workflow/edit ./server/service -run 'TestWorkflow|TXN-|SEC-' -count=1)
      - name: Run Workflow Canvas unit, type, build, and reviewed snapshot gates
        working-directory: web
        run: |
          npx vitest run tests/workflowCanvasMcpManifest.test.ts tests/helpers/workflowCanvasFixtures.test.js src/runner src/components/chat/WorkflowChangeArtifact.test.tsx src/lib/agentUiCardRegistry.test.tsx
          npm run typecheck
          npm run build
          npm run test:ui:workflow-snapshots
          npx playwright test e2e/workflow-canvas-accessibility.spec.js e2e/workflow-canvas-responsive.spec.js --project=chromium
      - name: Run real Workflow Canvas full-stack Chromium harness
        env:
          AIOPS_WORKFLOW_EVIDENCE_DIR: ${{ runner.temp }}/workflow-canvas-evidence
          AIOPS_WORKFLOW_E2E_PROJECTS: chromium
          PLAYWRIGHT_RETRIES: "0"
        run: scripts/run-workflow-canvas-e2e.sh
      - name: Verify Workflow Canvas evidence is safe to upload
        id: workflow_evidence_redaction
        if: ${{ always() }}
        run: scripts/check-workflow-evidence-redaction.sh "${RUNNER_TEMP}/workflow-canvas-evidence"
      - name: Upload Workflow Canvas evidence
        if: ${{ always() && steps.workflow_evidence_redaction.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: workflow-canvas-pr-evidence
          path: ${{ runner.temp }}/workflow-canvas-evidence
          if-no-files-found: error
          retention-days: 14
